name: Update events

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper
        run: node scripts/scrape.js

      # Create-only sync of new future events into Notion (Event Tracker Test by default).
      # Requires repo secret NOTION_TOKEN. Optional: NOTION_DATABASE_ID to retarget.
      - name: Sync new events to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          LIMIT: '0'
        run: node scripts/sync-notion.js

      - name: Commit updated events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/geocache.json
          git diff --cached --quiet || git commit -m "Update events.json"
          git push
