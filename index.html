<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Climate Designers Event Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <header>
    <h1>Climate Designers Event Tracker</h1>
    <p class="subtitle">All chapters, one place. Last updated: <span id="updated-at">—</span></p>
  </header>

  <main>
    <div class="controls">
      <div class="view-toggle">
        <button id="btn-table" class="view-btn active">List</button>
        <!-- <button id="btn-calendar" class="view-btn">Calendar</button>
        <button id="btn-map" class="view-btn">Map</button> -->
      </div>

      <div class="filters">
        <label>
          Region
          <select id="filter-region">
            <option value="">All regions</option>
          </select>
        </label>
        <label>
          Chapter
          <select id="filter-chapter">
            <option value="">All chapters</option>
          </select>
        </label>
      </div>
    </div>
    
    <section id="list-view">
      <section class="event-group open">
        <div class="event-group-header">
          <span>Upcoming</span>
          <button type="button" class="chevron" aria-hidden="true"></button>
        </div>
        <div class="event-group-body" id="upcoming-list"></div>
      </section>
    
      <section class="event-group">
        <div class="event-group-header">
          <span>Past</span>
          <button type="button" class="chevron" aria-hidden="true"></button>
        </div>
        <div class="event-group-body" id="past-list"></div>
      </section>
    </section>

    <section id="calendar-view" hidden>
      <div id="calendar"></div>
    </section>

    <section id="map-view" hidden>
      <div id="map"></div>
      <p id="no-located-events" class="empty-state" hidden>No located events match these filters.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
